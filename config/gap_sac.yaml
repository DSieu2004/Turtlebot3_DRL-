          - {dx: 0.75, dy: 0.35, dyaw: 0.0}
          - {dx: 0.75, dy: -0.35, dyaw: 0.0}
        min_episodes: 40
        max_episodes: 180
  hard_local_goal_curriculum:
    enabled: true
    start_stage: hard_forward_08
    promotion_window: 25
    min_success_rate: 0.85
    max_collision_rate: 0.02
    min_obstacle_exposure_rate: 0.35
    eval_episodes_on_promotion: 5
    min_eval_success_rate: 0.8
    stages:
      - name: hard_forward_08
        random_start: true
        safe_start_poses:
          - {x: -2.0, y: -0.5, z: 0.05, yaw: 0.0}
